# Runs Maalu from the published images, with its own Postgres:
#   docker compose -f docker-compose.prod.yml up -d      then open http://localhost:3000
# Put the settings in a .env next to this file (docker compose reads it):
#   SECRET_KEY=...         openssl rand -hex 32  (signs the API's tokens)
#   SESSION_SECRET=...     openssl rand -hex 32  (encrypts the web session cookie)
#   POSTGRES_PASSWORD=...  letters and digits only, it goes into a URL
# Optional, with their defaults:
#   POSTGRES_USER=maalu  POSTGRES_DB=maalu
#   PORT=3000              (the port the app is published on)
#   MAALU_VERSION=latest   (a release: 1.2.0, 1.2, sha-abc1234)
#   REGISTRATION=auto      (auto: only the first account can sign up; open: anyone; closed: no one)
#   RATE_LIMIT=true        (slows down password and code guessing; leave it on)
#   MAP_TILE_URL=          (map tiles for the location picker and Places page; default OpenStreetMap,
#                           or your own tile server: https://tiles.example.com/{z}/{x}/{y}.png)
#   MAP_ATTRIBUTION=       (credit for those tiles; a short HTML string)
#   GEOCODER_URL=          (place search in the map picker; default Nominatim's public server, set it
#                           empty to turn the search off)
#   Attachments (receipts) are kept in a volume by default. To use an S3-compatible bucket instead
#   (AWS S3, Cloudflare R2, MinIO...), set the bucket and, for anything but AWS, the endpoint:
#   ATTACHMENTS_S3_BUCKET=  ATTACHMENTS_S3_ENDPOINT=  ATTACHMENTS_S3_REGION=auto
#   ATTACHMENTS_S3_ACCESS_KEY_ID=  ATTACHMENTS_S3_SECRET_ACCESS_KEY=
#
# The session cookie is Secure in these images, so serve the app over HTTPS (or on localhost,
# which browsers treat as secure).
name: maalu-prod

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maalu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-maalu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ leaves the variables for the container's shell, which has them from `environment`.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/i701/maalu-api:${MAALU_VERSION:-latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maalu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-maalu}
      SECRET_KEY: ${SECRET_KEY}
      REGISTRATION: ${REGISTRATION:-auto}
      # Place search in the map picker (a geocoder; what is typed there is sent to it). Empty turns it
      # off. Only the default is used when this is not set at all.
      GEOCODER_URL: ${GEOCODER_URL-https://nominatim.openstreetmap.org/search}
      RATE_LIMIT: ${RATE_LIMIT:-true}
      # Only the web container can reach this service (no published port), so trust the visitor's
      # address it passes on in X-Forwarded-For. Without this every visitor would look like the
      # web container to the sign-in limits.
      FORWARDED_ALLOW_IPS: "*"
      ATTACHMENTS_S3_BUCKET: ${ATTACHMENTS_S3_BUCKET:-}
      ATTACHMENTS_S3_ENDPOINT: ${ATTACHMENTS_S3_ENDPOINT:-}
      ATTACHMENTS_S3_REGION: ${ATTACHMENTS_S3_REGION:-auto}
      ATTACHMENTS_S3_ACCESS_KEY_ID: ${ATTACHMENTS_S3_ACCESS_KEY_ID:-}
      ATTACHMENTS_S3_SECRET_ACCESS_KEY: ${ATTACHMENTS_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Background jobs (daily clean-up and the like): the same image as the API, running the
  # procrastinate worker instead of the web server. Run one; the queue lives in Postgres.
  worker:
    image: ghcr.io/i701/maalu-api:${MAALU_VERSION:-latest}
    command: ["procrastinate", "--app=app.jobs.app", "worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maalu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-maalu}
      SECRET_KEY: ${SECRET_KEY}
      PYTHONPATH: /app/apps/api
      ATTACHMENTS_S3_BUCKET: ${ATTACHMENTS_S3_BUCKET:-}
      ATTACHMENTS_S3_ENDPOINT: ${ATTACHMENTS_S3_ENDPOINT:-}
      ATTACHMENTS_S3_REGION: ${ATTACHMENTS_S3_REGION:-auto}
      ATTACHMENTS_S3_ACCESS_KEY_ID: ${ATTACHMENTS_S3_ACCESS_KEY_ID:-}
      ATTACHMENTS_S3_SECRET_ACCESS_KEY: ${ATTACHMENTS_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - attachments:/data/attachments
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  web:
    image: ghcr.io/i701/maalu-web:${MAALU_VERSION:-latest}
    environment:
      API_URL: http://api:8000
      SESSION_SECRET: ${SESSION_SECRET}
      # Where the map's tiles come from; empty means OpenStreetMap's public server.
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  attachments:
