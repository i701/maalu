services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: maalu
      POSTGRES_PASSWORD: maalu
      POSTGRES_DB: maalu
    ports:
      - "5432:5432"
    volumes:
      - maalu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maalu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  maalu-pgdata:
