[project]
name = "maalu"
version = "0.1.0"
description = "Maalu (މާލު) - open-source personal finance tracker"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = []

[tool.uv.workspace]
members = ["apps/api"]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ASYNC", "RUF", "PT", "TCH"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
