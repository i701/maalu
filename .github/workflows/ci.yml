name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, OpenAPI schema)
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1" # fail if uv.lock is out of date instead of silently re-resolving
      SECRET_KEY: ci-not-a-secret # the app needs one to start (here only to print its OpenAPI schema)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just check-api # ruff check + ruff format --check
      - run: just check-openapi # the committed OpenAPI schema (apps/web/openapi.json) is current

  api-tests:
    name: API tests (pytest)
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
      # The app needs one to start; the tests make their own users. Long enough not to trip the
      # JWT library's short-key warning.
      SECRET_KEY: ci-not-a-secret-ci-not-a-secret-ci-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      # Needs no Postgres: the tests run against in-memory SQLite and never reach the network.
      - run: just test-api

  web:
    name: Web (oxfmt, oxlint, tsc, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Reads the pnpm version from package.json "packageManager" and runs `pnpm install`.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: extractions/setup-just@v4
      - run: just check-web # oxfmt --check, oxlint, tsc --noEmit
      - run: just test-web # vitest: the pure helpers in src/lib
      - run: just check-generated-types # src/types/api.generated.ts matches the committed schema
      - run: just check-docs-json # the Android app's docs.json matches the web guides (fix: just docs-json)

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
      E2E_DATABASE_URL: postgresql+asyncpg://maalu:maalu@localhost:5432/maalu_e2e
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maalu
          POSTGRES_PASSWORD: maalu
          POSTGRES_DB: maalu_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maalu" --health-interval 5s --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm --filter @maalu/web exec playwright install --with-deps chromium
      # Playwright starts the API (migrating the database first) and the built web app itself.
      - run: pnpm --filter @maalu/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
