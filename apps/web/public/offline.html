<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Maalu is offline</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f7f9ff;
				--fg: #1a1c1e;
				--muted: #5b5f66;
				--accent: #1976d2;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #101418;
					--fg: #e2e2e6;
					--muted: #a9adb4;
					--accent: #90caf9;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 24px;
				background: var(--bg);
				color: var(--fg);
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					sans-serif;
			}
			main {
				max-width: 22rem;
				text-align: center;
			}
			img {
				width: 72px;
				height: 72px;
				border-radius: 20px;
			}
			h1 {
				font-size: 1.4rem;
				margin: 20px 0 8px;
			}
			p {
				margin: 0 0 20px;
				line-height: 1.5;
				color: var(--muted);
			}
			button {
				font: inherit;
				font-weight: 600;
				color: #fff;
				background: var(--accent);
				border: 0;
				border-radius: 999px;
				padding: 12px 28px;
				cursor: pointer;
			}
			@media (prefers-color-scheme: dark) {
				button {
					color: #001d36;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icon-192.png" alt="" width="72" height="72" />
			<h1>You are offline</h1>
			<p>
				Maalu keeps your money data on your own server, so it needs a connection to show it. Nothing
				is lost: reconnect and carry on.
			</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
