name: Maalu
options:
  bundleIdPrefix: app.maalu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Maalu:
    type: application
    platform: iOS
    sources: [Maalu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.maalu
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Maalu
        ASSETCATALOG_COMPILER_APPICON_NAME: Maalu
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # A development server on the Mac is plain http (http://localhost:8000).
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        ENABLE_PREVIEWS: YES
  MaaluTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MaaluTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.maalu.tests
    dependencies:
      - target: Maalu
